[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphakrx"
version = "0.1.0"
description = "Korean equity quantitative trading system"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "AlphaKRX Team", email = "team@alphakrx.io"}
]
requires-python = ">=3.10"
keywords = ["quantitative-trading", "krx", "korean-stocks", "lightgbm", "backtesting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests>=2.25.0",
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "openpyxl>=3.0.0",
    "prettytable>=3.10.0",
    "lightgbm>=3.3.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.7.0",
    "numba>=0.57.0",
    "exchange_calendars>=4.2.0",
    "psutil>=5.8.0",
    "schedule>=1.1.0",
    "python-dateutil>=2.8.0",
    "pyyaml>=5.4.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "pytest-xdist>=3.0.0",
    "black>=21.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
api = [
    "selenium>=4.0.0",
    "webdriver-manager>=4.0.0",
]
verify = [
    "finance-datareader>=0.9.50",
]
docs = [
    "sphinx>=4.0.0",
    "sphinx-rtd-theme>=0.5.0",
    "jupyter-sphinx>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/alphakrx/alphakrx"
Documentation = "https://alphakrx.readthedocs.io"
Repository = "https://github.com/alphakrx/alphakrx"
Issues = "https://github.com/alphakrx/alphakrx/issues"

[project.scripts]
alphakrx-backtest = "scripts.run_backtest:main"
alphakrx-live = "scripts.run_live:main"
alphakrx-etl = "scripts.run_etl:main"
alphakrx-picks = "scripts.get_picks:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ml*", "scripts*", "config*"]
exclude = ["tests*", "docs*", "verification*", "tools*", "etl*"]

[tool.setuptools.package-data]
config_pydantic = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["tests/", "docs/", "build/", "dist/"]

[tool.coverage.run]
source = ["ml", "scripts", "config_pydantic"]
omit = ["tests/*", "*/test_*.py", "**/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pre-commit-config]
repos = [
    {repo = "https://github.com/pre-commit/pre-commit-hooks", rev = "v4.4.0", hooks = ["trailing-whitespace", "end-of-file-fixer", "check-yaml", "check-added-large-files"]},
    {repo = "https://github.com/astral-sh/ruff-pre-commit", rev = "v0.1.0", hooks = ["ruff", "ruff-format"]},
    {repo = "https://github.com/pre-commit/mirrors-mypy", rev = "v1.4.0", hooks = ["mypy"]},
]
